# Portainer / docker compose stack for the world renderer.
#
# Stack -> "new stack" in Portainer, paste this, deploy. Four things you may have to point at:
#
#   1. WORLD (below) — where a copy of DarkRPG/ lives on the host. The container only reads it.
#   2. the image — either build it here ("build: ."), or build it on your machine and push it to a
#      registry Portainer can pull, then change `image:` and drop `build:`.
#   3. build: — a pasted stack has no build context on the host, so `build:` only works if the stack
#      is deployed from the git repository (Portainer clones it into the stack path) or you build
#      the image yourself first. If you pre-build, delete the `build:` block.
#   4. the packs — a clone has none of them (derived, git-ignored, ~168 MB). Either bake them into the
#      image on a machine that holds the save and your own jars, or mount them read-only: see the
#      `volumes:` block below, whose target paths are exactly the paths the server reads by default.
#
# On Portainer, set the two host paths in the stack's "Environment variables" table rather than editing
# this file (a relative bind source is resolved next to Portainer's own stack directory, not next to here):
#
#   MCMAP_SAVE=/srv/mcmap/DarkRPG      the folder that contains world/
#   MCMAP_PACKS=/srv/mcmap/packs       assets/ shells/ lods/ ledger/, baked once with npm run bake
#
# Both default to paths beside this file, so `docker compose up` on the machine that baked everything
# still needs no arguments.
#
# If the host has no copy of the save, the container still comes up and serves the baked far layers
# and the action history, but /voxels 404s and the browser shows holes where detail should be.

name: mcmap

services:
  worldd:
    build:
      context: .
    image: mcmap:latest
    container_name: mcmap
    restart: unless-stopped

    # One port, one service. The page it serves asks this same origin for /voxels, /shells, /lods,
    # /ledger and /assets, so there is nothing else to expose.
    ports:
      - "8765:8765"

    environment:
      # The port worldd listens on inside the container. Named here rather than left to the default
      # because the health check below reads this same variable.
      WD_PORT: "8765"
      # The save, inside the container. Matches the read-only mount below.
      WD_WORLD: /data/DarkRPG/world
      # Where decoded chunk payloads are memoised. Keeps a pan across ground you already visited
      # from re-decoding NBT. Bounded by WD_CACHE_MAX_GB and swept on boot.
      WD_CACHE: /data/cache
      WD_CACHE_MAX_GB: "6"
      # Baked packs, shipped in the image. Set these to a mount if you ship packs separately.
      WD_PACKS: /srv/app/build/shells
      WD_LODS: /srv/app/build/lods
      WD_LEDGER: /srv/app/build/ledger
      WD_ASSETS: /srv/app/build/assets
      # Skins are the one optional pack: no build/skins in the image and the cast stands tinted, which is
      # a visible answer in the panel rather than a broken one.
      WD_SKINS: /srv/app/build/skins
      # A request slower than this is logged with its route, so you can see what is slow from the
      # container log instead of the browser.
      WD_SLOW_MS: "400"
      # Boot + every 60 s, one line: what it is serving and what it has open.
      WD_HEARTBEAT: "60"

    volumes:
      # THE SAVE. Read-only: the renderer never writes to a world. Two ways to say where it is:
      # set MCMAP_SAVE to an ABSOLUTE host path in Portainer's stack "Environment variables" table
      # (recommended - a relative path is resolved next to Portainer's own stack directory, not next
      # to this file), or leave it alone and keep a DarkRPG/ folder beside the compose file.
      #   MCMAP_SAVE=/srv/mcmap/DarkRPG
      - type: bind
        source: ${MCMAP_SAVE:-./DarkRPG}
        target: /data/DarkRPG
        read_only: true
      # The payload cache. A named volume survives redeploys; delete it whenever you like.
      - mcmap-cache:/data/cache

      # THE PACKS. The image is built from this repository, so it carries keep files instead of packs:
      # mount a baked pack tree at the paths worldd already reads, and no WD_* has to change. Point
      # MCMAP_PACKS at a directory holding assets/, shells/, lods/, ledger/ (about 167 MB once extracted;
      # build/cache is NOT one of them - it is regenerated per container):
      #   MCMAP_PACKS=/srv/mcmap/packs
      # Leave it unset and the mounts land next to the stack, empty, and the boot log says so:
      #   shell packs: nothing at /srv/app/build/shells — mount a pack (WD_PACKS) or run node server/bake-shells.mjs
      # A missing ASSET pack stops the boot on purpose; a missing shell/LOD/ledger pack does not, it just
      # leaves no far layers / no action history, which is a hole you can see rather than a crash.
      - type: bind
        source: ${MCMAP_PACKS:-./packs}/assets
        target: /srv/app/build/assets
        read_only: true
      - type: bind
        source: ${MCMAP_PACKS:-./packs}/shells
        target: /srv/app/build/shells
        read_only: true
      - type: bind
        source: ${MCMAP_PACKS:-./packs}/lods
        target: /srv/app/build/lods
        read_only: true
      - type: bind
        source: ${MCMAP_PACKS:-./packs}/ledger
        target: /srv/app/build/ledger
        read_only: true

    healthcheck:
      # Portainer's compose loader rejects a bare exec array here and wants the first word to say how
      # to run the rest: "CMD" (exec, no shell), "CMD-SHELL" (through /bin/sh) or "NONE" (disable).
      # Docker compose accepts the bare form; Portainer does not, and the whole stack deploy fails.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.WD_PORT||8765)+'/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      # Boot ends with a cache sweep. On a current cache it is cheap - 1 s to the first /stats over a
      # 627k-file / 1.4 GB cache - but a volume left behind by an OLDER build is measured and deleted
      # whole, and that walk alone takes ~77 s for 627k files. /stats does not answer until the sweep
      # is done, so a short start period kills the container mid-chore and it restarts in a loop.
      start_period: 300s
      interval: 30s
      timeout: 5s
      retries: 3

    # The log is the whole operational surface: slow requests, cache sweep progress, the heartbeat.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "4"

volumes:
  mcmap-cache:
