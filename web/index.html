<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DarkRPG world viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden;
    font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; }

  /* The only permanent readout: how many frames a second, and a status line when there is something
     to say (booting, streaming, an error). Press H for the instrument panel underneath it. */
  #pill { position: fixed; left: 10px; top: 10px; display: flex; align-items: baseline; gap: 6px;
    max-width: 72vw; padding: 3px 10px; border-radius: 999px; font-size: 11px;
    background: rgba(8, 11, 15, .55); border: 1px solid rgba(255, 255, 255, .10); color: #8b96a3;
    backdrop-filter: blur(3px); pointer-events: none; }
  #pill b { color: #7fe0a8; font-weight: 600; font-size: 13px; }
  #pill .u { color: #6d7783; }
  #pill .st { color: #7d8794; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pill .st.err { color: #ff8f8f; }
  #pill .st:empty { display: none; }

  /* The instrument panel: fps buckets, mesh timings, worker count, the dimension picker. Hidden
     unless the page was opened with ?debug=1 or the user presses H, because it is a workbench, not
     a UI - and every headless probe already loads ?debug=1, so hiding it costs the tooling nothing. */
  #hud { position: fixed; left: 10px; top: 36px; padding: 8px 10px; border-radius: 8px;
    background: rgba(8, 11, 15, .74); border: 1px solid rgba(255, 255, 255, .12);
    color: #dfe7ef; backdrop-filter: blur(3px); pointer-events: none; }
  body.hidehud #hud { display: none; }
  #hud b { color: #9fc7ff; font-weight: 600; }
  #hud .row { display: flex; gap: 8px; }
  #hud .k { color: #8b96a3; min-width: 62px; }

  /* One line of keys. Fades after a moment so the world is what you look at; H brings it back. */
  #help { position: fixed; right: 10px; top: 10px; padding: 4px 10px; border-radius: 999px;
    font-size: 11px; background: rgba(8, 11, 15, .5); border: 1px solid rgba(255, 255, 255, .08);
    color: #8b96a3; pointer-events: none; transition: opacity .7s; }
  #help b { color: #cfd8e3; }
  body.helpgone #help { opacity: 0; }
  select { color-scheme: dark; background: #131922; color: #dfe7ef; border: 1px solid #2c3642;
    border-radius: 4px; padding: 1px 4px; font: inherit; }
  /* The HUD is pointer-events:none so drags fall through to the canvas - but its dimension picker
     has to be clickable, or the world can only be changed by editing the URL. */
  #hud select { pointer-events: auto; }

  /* The settings panel (web/js/ui.js). Plain DOM, so its look lives here. */
  /* Width, label width and value width are variables because the panel is resizable (drag its left
     edge, or the `panel width` row) and because one column has to hold what the page prints: the
     longest thing the value column ever carries is the time machine's date stamp, and at 88 px it was
     being ellipsised. */
  .panel { position: fixed; right: 10px; bottom: 10px; width: var(--panelw, 396px);
    --panel-labw: 126px; --panel-valw: 122px; border-radius: 10px;
    background: rgba(9, 12, 17, .86); border: 1px solid rgba(255, 255, 255, .10); color: #b8c2cf;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35); backdrop-filter: blur(4px); user-select: none;
    z-index: 3; font-size: 11.5px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 10px; cursor: pointer; }
  .panel-title { color: #9fc7ff; }
  .panel.collapsed { width: auto; }
  .panel.collapsed .panel-body { display: none; }
  .panel-body { padding: 2px 10px 10px; max-height: 68vh; overflow-y: auto; line-height: 1.3; }
  .panel-row { display: grid; grid-template-columns: var(--panel-labw) 1fr var(--panel-valw);
    align-items: center; gap: 8px; padding: 3px 0; color: #b8c2cf; }
  .panel-label { cursor: help; }
  .panel-row input[type=range] { width: 100%; height: 18px; accent-color: #6ea8ff; margin: 0; }
  .panel-row input[type=checkbox] { justify-self: start; accent-color: #6ea8ff; }
  .panel-val { color: #7fe0a8; text-align: right; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .panel-row select { width: 100%; max-width: 210px; justify-self: end; }
  /* A tick's value column is often a sentence ("decals paint over the world") rather than a number, so
     that row sizes its value column to the sentence. minmax(0, ...) so a narrow panel still gets an
     ellipsis instead of text running over the panel's own edge. */
  .panel-row.panel-check { grid-template-columns: var(--panel-labw) 1fr minmax(0, max-content); }
  /* The world picker names a whole dimension; give it the whole control row. */
  .panel-row.panel-select { grid-template-columns: var(--panel-labw) 1fr; }
  .panel-row.panel-select select { max-width: none; }
  .panel-section { margin: 9px 0 2px; border-top: 1px solid rgba(255, 255, 255, .07); padding-top: 6px; }
  .panel-section > summary { color: #7f8a97; cursor: pointer; list-style: none; letter-spacing: .02em; }
  .panel-section > summary::before { content: '+ '; color: #6ea8ff; }
  .panel-section[open] > summary::before { content: '- '; }
  .panel-section > summary:hover { color: #cfd8e3; }
  .panel-section-head { display: block; }
  .panel-note { color: #6f7a87; padding: 4px 0 1px; }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px;
    border-top: 1px solid rgba(255, 255, 255, .07); padding-top: 9px; }
  .panel-btn { background: #131922; color: #dfe7ef; border: 1px solid #2c3642; border-radius: 5px;
    padding: 3px 8px; font: inherit; cursor: pointer; }
  .panel-btn:hover { background: #1b2431; border-color: #3d4a5c; }
  .panel-btn.mini { padding: 1px 7px; color: #8b96a3; }
  /* The resize edge. A strip down the left side of the panel: dragging it left makes the panel wider,
     which is which way a person would pull a panel that is anchored to the right. */
  .panel-grip { position: absolute; left: -2px; top: 8px; bottom: 8px; width: 9px; cursor: ew-resize; }
  .panel-grip::after { content: ''; position: absolute; left: 3px; top: 50%; margin-top: -18px;
    width: 3px; height: 36px; border-radius: 2px; background: rgba(255, 255, 255, .14); }
  .panel-grip:hover::after, .panel-grip.dragging::after { background: #6ea8ff; }
  .panel.collapsed .panel-grip { display: none; }

  /* The ledger card (M12): "who placed this", answered at the top, evidence underneath. Every evidence
     row is a button, because the next thing a person wants after reading who is to stand there. The
     pill's status line is nowrap-with-ellipsis, so anything worth reading lives here instead. */
  .lcard { position: fixed; left: 10px; bottom: 10px; width: min(600px, 46vw); max-height: 44vh;
    overflow-y: auto; background: rgba(9, 12, 17, .90); border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px; color: #b8c2cf; font-size: 11.5px; padding: 8px 10px 10px; z-index: 4;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .4); backdrop-filter: blur(4px); }
  .lcard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    color: #9fc7ff; font-weight: 600; margin-bottom: 4px; }
  .lcard-x { background: none; border: 0; color: #6f7a87; font-size: 15px; line-height: 1;
    cursor: pointer; padding: 0 2px; }
  .lcard-x:hover { color: #dfe7ef; }
  .lcard-sub { color: #6f7a87; margin: 3px 0 6px; }
  .lcard-row { display: block; width: 100%; text-align: left; background: none; cursor: pointer;
    border: 0; border-left: 2px solid #2c3642; padding: 2px 0 2px 7px; margin: 1px 0; color: #cfd8e3;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  .lcard-row:hover { border-left-color: #ffb454; background: rgba(255, 255, 255, .05); }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="pill"><b id="fps">–</b><span class="u">fps</span><span class="u" id="scale"></span><span class="st" id="msg"></span></div>

<div id="hud">
  <div class="row"><span class="k">verts</span><b id="verts">-</b><span class="k">tris</span><b id="tris">-</b></div>
  <div class="row"><span class="k">chunks</span><b id="chunks">-</b></div>
  <div class="row"><span class="k">cpu</span><b id="cpu">-</b></div>
  <div class="row"><span class="k">net</span><b id="queue">-</b></div>
  <div class="row"><span class="k">mesh</span><b id="mesh">-</b></div>
  <div class="row"><span class="k">far</span><b id="shell">-</b></div>
  <div class="row"><span class="k">cam</span><b id="campos">-</b></div>
  <div class="row"><span class="k">dim</span><select id="dim"></select></div>
</div>

<div id="help">
  <b>drag</b> orbit &nbsp; <b>right-drag</b> pan &nbsp; <b>wheel</b> zoom &nbsp; <b>WASD</b> move
  &nbsp; <b>V</b> walk &nbsp; <b>P</b> settings &nbsp; <b>F</b> whole world &nbsp; <b>H</b> readouts
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
